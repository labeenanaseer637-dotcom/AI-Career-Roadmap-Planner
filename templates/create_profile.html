{% extends "base.html" %}

{% block title %}
Create Profile
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header text-center text-white py-4"
                     style="background: linear-gradient(135deg,#4F46E5,#7C3AED);">

                    <h2 class="fw-bold mb-2">
                        🚀 Create Your AI Career Profile
                    </h2>

                    <p class="mb-0">
                        Build your personalized AI learning journey.
                    </p>

                </div>

                <div class="card-body p-5">

                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST">

                        <h4 class="text-primary mb-3">
                            👤 Personal Information
                        </h4>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Age
                                </label>

                                <input
                                    type="number"
                                    name="age"
                                    class="form-control"
                                    placeholder="Enter your age"
                                    min="10"
                                    max="100"
                                    required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Education
                            </label>

                            <select
                                name="education"
                                class="form-select"
                                required>

                                <option value="">Select Education</option>
                                <option value="Matric">Matric</option>
                                <option value="Intermediate">Intermediate</option>
                                <option value="Bachelor">Bachelor</option>
                                <option value="Master">Master</option>
                                <option value="PhD">PhD</option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Daily Study Hours
                            </label>

                            <input
                                type="number"
                                step="0.5"
                                min="0"
                                max="24"
                                name="study_hours"
                                class="form-control"
                                placeholder="Example: 3.5"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Career Goal
                            </label>

                            <select
                                name="career_goal"
                                class="form-select"
                                required>

                                <option value="">Select Career Goal</option>

                                {% for career in careers %}

                                <option value="{{ career }}">
                                    {{ career }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <hr class="my-4">

                        <h4 class="text-primary mb-3">
                            🧠 Learning Profile
                        </h4>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Current Skill Level
                            </label>

                            <select
                                name="current_level"
                                class="form-select">

                                <option>Beginner</option>
                                <option>Intermediate</option>
                                <option>Advanced</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Programming Experience
                            </label>

                            <select
                                name="programming_experience"
                                class="form-select">

                                <option>No Experience</option>
                                <option>Basic Python/C++</option>
                                <option>Intermediate Programming</option>
                                <option>Advanced Programming</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Interests
                            </label>

                            <input
                                type="text"
                                name="interests"
                                class="form-control"
                                placeholder="AI, Machine Learning, Robotics"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Preferred Learning Style
                            </label>

                            <select
                                name="learning_style"
                                class="form-select">

                                <option>Video Learning</option>
                                <option>Reading</option>
                                <option>Practice Based</option>
                                <option>Project Based</option>

                            </select>

                        </div>

                        <hr class="my-4">

                        <h4 class="text-primary mb-3">
                            🔐 Account Information
                        </h4>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="example@email.com"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Create a strong password"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Re-enter your password"
                                required>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg">

                                <i class="bi bi-person-plus-fill me-2"></i>

                                Create Profile

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
