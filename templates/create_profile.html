{% extends "base.html" %}

{% block title %}
Create Profile
{% endblock %}


{% block content %}

<div class="container mt-5 mb-5">


<div class="row justify-content-center">

<div class="col-lg-7">


<div class="card shadow-lg rounded-4 border-0">


<div class="card-header text-white text-center py-4"
style="background:linear-gradient(135deg,#4F46E5,#7C3AED);">

<h2>
🚀 Create Your AI Career Profile
</h2>

<p class="mb-0">
Start your personalized learning journey
</p>

</div>



<div class="card-body p-4">


{% if error %}

<div class="alert alert-danger rounded-4">

<i class="bi bi-exclamation-triangle-fill me-2"></i>

{{ error }}

</div>

{% endif %}



<form method="POST">



<label class="fw-semibold">
Name
</label>

<input 
type="text"
name="name"
class="form-control mb-3"
placeholder="Enter your name"
required>




<label class="fw-semibold">
Age
</label>

<input 
type="number"
name="age"
class="form-control mb-3"
placeholder="Enter your age"
required>




<label class="fw-semibold">
Education
</label>

<select name="education"
class="form-select mb-3"
required>

<option value="">
Select Education
</option>

<option value="Matric">
Matric
</option>

<option value="Intermediate">
Intermediate
</option>

<option value="Bachelor">
Bachelor
</option>

<option value="Master">
Master
</option>

<option value="PhD">
PhD
</option>

</select>





<label class="fw-semibold">
Daily Study Hours
</label>

<input 
type="number"
step="0.1"
name="study_hours"
class="form-control mb-3"
placeholder="Example: 3.5"
required>





<label class="fw-semibold">
Career Goal
</label>

<select name="career_goal"
class="form-select mb-3">


{% for career in careers %}

<option value="{{career}}">
{{career}}
</option>

{% endfor %}


</select>





<hr>



<h5 class="text-primary">

🧠 Learning Profile

</h5>



<label class="fw-semibold">
Current Skill Level
</label>

<select name="current_level"
class="form-select mb-3">

<option>
Beginner
</option>

<option>
Intermediate
</option>

<option>
Advanced
</option>

</select>





<label class="fw-semibold">
Programming Experience
</label>


<select name="programming_experience"
class="form-select mb-3">


<option>
No Experience
</option>

<option>
Basic Python/C++
</option>

<option>
Intermediate Programming
</option>

<option>
Advanced Programming
</option>


</select>





<label class="fw-semibold">
Your Interests
</label>


<input
type="text"
name="interests"
class="form-control mb-3"
placeholder="AI, Data Science, Robotics"
required>





<label class="fw-semibold">
Preferred Learning Style
</label>


<select name="learning_style"
class="form-select mb-3">


<option>
Video Learning
</option>

<option>
Reading
</option>

<option>
Projects
</option>

<option>
Practice Based
</option>


</select>





<hr>



<h5 class="text-primary">

🔐 Account Information

</h5>




<label class="fw-semibold">
Email
</label>


<input
type="email"
name="email"
class="form-control mb-3"
placeholder="Enter your email"
required>





<label class="fw-semibold">
Password
</label>


<input
type="password"
name="password"
class="form-control mb-3"
placeholder="Create password"
required>





<label class="fw-semibold">
Confirm Password
</label>


<input
type="password"
name="confirm_password"
class="form-control mb-4"
placeholder="Confirm password"
required>






<button 
type="submit"
class="btn btn-primary w-100 py-3"
onclick="showSpinner(this)">

<i class="bi bi-rocket-takeoff-fill me-2"></i>

Create Profile

</button>




</form>


</div>


</div>


</div>


</div>


</div>


{% endblock %}
