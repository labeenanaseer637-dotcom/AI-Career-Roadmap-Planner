<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
{% block title %}
AI Career Roadmap Planner
{% endblock %}
</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<!-- External CSS -->
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

<style>

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter','Segoe UI',sans-serif;
    background:linear-gradient(180deg,#F8FAFC,#EEF2FF);
    color:#1E293B;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* ==========================
   NAVBAR
========================== */

.navbar{
    background:linear-gradient(135deg,#4F46E5,#7C3AED);
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    padding:15px 0;
    position:sticky;
    top:0;
    z-index:1000;
}

.navbar-brand{
    font-size:22px;
    font-weight:700;
}

.nav-link{
    color:white!important;
    font-weight:500;
    margin-left:10px;
    padding:8px 14px;
    border-radius:10px;
    transition:.3s;
}

.nav-link:hover{
    background:rgba(255,255,255,.15);
    color:#FDE68A!important;
}

.nav-link.active{
    background:rgba(255,255,255,.20);
    color:#FDE68A!important;
}

/* ==========================
   PAGE
========================== */

main{
    flex:1;
}

.container{
    max-width:1200px;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.page-content{
    animation:fadeIn .6s ease;
}

/* ==========================
   CARDS
========================== */

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 20px 40px rgba(0,0,0,.12);
}

/* ==========================
   BUTTONS
========================== */

.btn{
    border-radius:12px;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

/* ==========================
   FOOTER
========================== */

footer{
    background:#111827;
    color:white;
    margin-top:60px;
}

footer h5{
    font-weight:700;
}

footer p{
    color:#CBD5E1;
}

footer small{
    color:#94A3B8;
}

/* ==========================
   MOBILE
========================== */

@media (max-width:768px){

.navbar-brand{
    font-size:18px;
}

.nav-link{
    margin:5px 0;
}

.container{
    padding-left:15px;
    padding-right:15px;
}

}

</style>

</head>

<body>

<!-- ==========================
     NAVBAR
========================== -->

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a class="navbar-brand"
href="{{ url_for('dashboard') }}">

<i class="bi bi-cpu-fill me-2"></i>

AI Career Planner

</a>

<button class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#navbarNav">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse"
id="navbarNav">

<ul class="navbar-nav ms-auto">

<li class="nav-item">

<a class="nav-link {% if request.endpoint=='dashboard' %}active{% endif %}"
href="{{ url_for('dashboard') }}">

<i class="bi bi-house-door-fill me-1"></i>

Dashboard

</a>

</li>

<li class="nav-item">

<a class="nav-link {% if request.endpoint=='roadmap' %}active{% endif %}"
href="{{ url_for('roadmap') }}">

<i class="bi bi-signpost-split-fill me-1"></i>

Roadmap

</a>

</li>

<li class="nav-item">

<a class="nav-link {% if request.endpoint=='analytics' %}active{% endif %}"
href="{{ url_for('analytics') }}">

<i class="bi bi-bar-chart-fill me-1"></i>

Analytics

</a>

</li>

<li class="nav-item">

<a class="nav-link {% if request.endpoint=='profile' %}active{% endif %}"
href="{{ url_for('profile') }}">

<i class="bi bi-person-circle me-1"></i>

Profile

</a>

</li>

<li class="nav-item">

<a class="nav-link text-warning"
href="{{ url_for('logout') }}">

<i class="bi bi-box-arrow-right me-1"></i>

Logout

</a>

</li>

</ul>

</div>

</div>

</nav>

<!-- ==========================
     PAGE CONTENT
========================== -->

<main>

<div class="container mt-5 page-content">

{% block content %}
{% endblock %}

</div>

</main>

<!-- ==========================
     FOOTER
========================== -->

<footer>

<div class="container text-center py-4">

<h5>
🤖 AI Career Roadmap Planner
</h5>

<p class="mb-1">
Helping students build successful careers in Artificial Intelligence.
</p>

<small>

© {{ current_year }} Labeena Naseer • Built with ❤️ using Flask & Bootstrap

</small>

</div>

</footer>

<!-- ==========================
     LOADING SPINNER
========================== -->

<script>

function showSpinner(button){

button.disabled=true;

button.innerHTML=`
<span class="spinner-border spinner-border-sm me-2"></span>
Loading...
`;

}

</script>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
